<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mipolune Tycoon</title><style>*{box-sizing:border-box}body{margin:0;background:#103a32;color:#fff;font:16px system-ui}main{max-width:520px;margin:auto;padding:18px}h1,h2{color:#ffda83}button{background:#ffda83;color:#163d32;border:0;border-radius:12px;padding:14px;font-weight:bold;cursor:pointer}button:disabled{opacity:.4}.city{background:linear-gradient(135deg,#8edce4 25%,#f7e5b1 25%,#a4d394 38%);display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:20px;border-radius:20px}.tile{font-size:32px;min-height:75px;background:#ffffffbb}.panel{background:#205348;border-radius:16px;padding:16px;margin-top:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0}#sell{width:100%;margin-top:12px}small{color:#c1dfd2}.tabs{display:flex;gap:6px;margin-top:12px}.tabs button{flex:1;padding:10px 4px}.tile{box-shadow:0 5px 0 #538b65;transition:transform .15s}.tile:active{transform:scale(.94)}.city{position:relative;padding-bottom:50px}.city:after{content:"🌴  🚕  ━━━━━  🚙  🌴";position:absolute;bottom:8px;left:0;right:0;text-align:center;background:#728b89;padding:5px}button:focus-visible{outline:3px solid white} </style><main><h1>MIPOLUNE TYCOON</h1><small>Petit commerce. Grande fortune.</small><h2 id="cash"></h2><p id="stats"></p><div class="city" id="city"></div><button id="sell"></button><div class="panel" id="panel"></div><div class="tabs"><button id="missions">🎯 Missions</button><button id="luxury">💎 Luxe</button><button id="settings">⚙️ Options</button></div><div class="panel" id="extra" hidden></div><div class="panel"><button id="daily">🎁 Cadeau quotidien</button><p id="msg" aria-live="polite"></p></div></main><script>
const names=['Limonade','Café','Boulangerie','Restaurant','Supermarché','Hôtel','Centre commercial','Banque','Centre spatial'],icons=['🍋','☕','🥐','🍔','🛒','🏨','🛍️','🏦','🚀'],prices=[0,400,1500,5000,18000,65000,250000,1000000,5000000],base=[10,35,100,300,1000,3500,12000,50000,200000];let s={cash:100,xp:0,shops:[{rank:1,staff:0}],selected:0,last:Date.now(),daily:''};const $=id=>document.getElementById(id),fmt=n=>Math.floor(n).toLocaleString('fr-FR')+' €',rev=i=>Math.floor(base[i]*s.shops[i].rank*(1+(s.prestige||0)*.5+(s.lux||[]).length*.1)),rate=()=>s.shops.reduce((a,b,i)=>a+b.staff*rev(i)/4,0),level=()=>Math.min(100,1+Math.floor(Math.sqrt(s.xp/8)));try{let v=localStorage.getItem('mipolune');if(v){s=JSON.parse(v);s.cash+=rate()*Math.min(14400,Math.max(0,(Date.now()-s.last)/1000))}}catch(e){}s.lux??=[];s.claimed??=[];s.sales??=0;s.prestige??=0;s.sound??=true;function save(){s.last=Date.now();try{localStorage.setItem('mipolune',JSON.stringify(s))}catch(e){}}function draw(){let i=s.selected,b=s.shops[i],up=Math.floor(base[i]*5*1.55**(b.rank-1)),hire=base[i]*12*(b.staff+1);$('cash').textContent=fmt(s.cash);$('stats').textContent='Niveau '+level()+'/100 • '+fmt(rate())+'/s';$('city').innerHTML=names.map((n,j)=>'<button class="tile" data-i="'+j+'" aria-label="'+n+'">'+(j<s.shops.length?icons[j]:j===s.shops.length?'＋':'🔒')+'</button>').join('');$('sell').textContent='Vendre +'+fmt(rev(i));$('panel').innerHTML='<h3>'+icons[i]+' '+names[i]+'</h3><small>Commerce niveau '+b.rank+' • '+b.staff+' employés</small><div class="row">Améliorer <button id="up" '+(s.cash<up?'disabled':'')+'>'+fmt(up)+'</button></div><div class="row">Recruter <button id="hire" '+(s.cash<hire?'disabled':'')+'>'+fmt(hire)+'</button></div>'; $('up').onclick=()=>{if(s.cash>=up){s.cash-=up;b.rank++;s.xp+=10;draw();save()}};$('hire').onclick=()=>{if(s.cash>=hire){s.cash-=hire;b.staff++;s.xp+=10;draw();save()}};$('daily').disabled=s.daily===new Date().toDateString()}
$('city').onclick=e=>{let b=e.target.closest('[data-i]');if(!b)return;let i=+b.dataset.i;if(i<s.shops.length)s.selected=i;else if(i===s.shops.length){if(s.cash>=prices[i]&&confirm('Construire '+names[i]+' pour '+fmt(prices[i])+' ?')){s.cash-=prices[i];s.shops.push({rank:1,staff:0});s.selected=i;s.xp+=35}else $('msg').textContent='Prochain commerce : '+names[i]+' — '+fmt(prices[i])}draw();save()};$('sell').onclick=()=>{s.cash+=rev(s.selected);s.sales++;s.xp+=5;beep();draw();save()};$('daily').onclick=()=>{let d=new Date().toDateString();if(s.daily!==d){s.daily=d;s.cash+=250*level();draw();save()}};let mode='';const lux=[['🏎️ Voiture',15000],['🛥️ Yacht',100000],['🏡 Villa',500000],['✈️ Jet',2000000],['🏝️ Île',10000000]];function beep(){if(!s.sound)return;try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=660;g.gain.value=.025;o.start();o.stop(a.currentTime+.07);o.onended=()=>a.close()}catch(e){}}function tasks(){return [['10 ventes',s.sales,10,150],['3 commerces',s.shops.length,3,1500],['Niveau 10',level(),10,3000],['9 commerces',s.shops.length,9,1000000]]}function extra(){let e=$('extra');e.hidden=!mode;if(mode==='missions')e.innerHTML=tasks().map((t,i)=>'<div class="row">'+t[0]+' ('+Math.min(t[1],t[2])+'/'+t[2]+') <button data-claim="'+i+'" '+(s.claimed.includes(i)||t[1]<t[2]?'disabled':'')+'>'+fmt(t[3])+'</button></div>').join('');if(mode==='luxury')e.innerHTML=lux.map((t,i)=>'<div class="row">'+t[0]+' <button data-lux="'+i+'" '+(s.lux.includes(i)||s.cash<t[1]?'disabled':'')+'>'+(s.lux.includes(i)?'Acquis':fmt(t[1]))+'</button></div>').join('')+'<button id="prestige" '+(s.cash<1e7?'disabled':'')+'>Prestige : 10 M € (+50 % permanent)</button>';if(mode==='settings')e.innerHTML='<button id="sound">Son : '+(s.sound?'activé':'désactivé')+'</button><p>Argent fictif. Sauvegarde sur cet appareil.</p>'}for(let k of ['missions','luxury','settings'])$(k).onclick=()=>{mode=mode===k?'':k;extra()};$('extra').onclick=e=>{let b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.claim!==undefined){let i=+b.dataset.claim,t=tasks()[i];if(!s.claimed.includes(i)&&t[1]>=t[2]){s.claimed.push(i);s.cash+=t[3]}}if(b.dataset.lux!==undefined){let i=+b.dataset.lux;if(!s.lux.includes(i)&&s.cash>=lux[i][1]){s.cash-=lux[i][1];s.lux.push(i)}}if(b.id==='sound')s.sound=!s.sound;if(b.id==='prestige'&&s.cash>=1e7&&confirm('Recommencer avec un bonus permanent ?')){s.cash=100;s.xp=0;s.sales=0;s.shops=[{rank:1,staff:0}];s.selected=0;s.claimed=[];s.prestige++}draw();extra();save()};draw();save();setInterval(()=>{s.cash+=rate();draw();extra();save()},1000);
</script></html>
