<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102a2b">
  <meta name="description" content="Développez vos commerces et transformez une baie méditerranéenne en capitale économique.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>Mipolune Tycoon</title>
</head>
<body>
  <main class="game">
    <section class="view" aria-label="Ville de Mipolune">
      <div id="world"></div>
      <div id="markers"></div>
      <div id="fallback" hidden>Vue 3D indisponible. Ouvrez le plan pour accéder aux commerces.</div>
    </section>
    <header class="hud">
      <div class="brand"><span class="brand-icon" aria-hidden="true">◒</span><div><h1>Mipolune</h1><span>TYCOON</span></div></div>
      <div class="funds"><small>Trésorerie</small><strong id="cash">100 €</strong></div>
    </header>
    <div class="indicators">
      <span id="reputation"></span>
      <span id="income"></span>
      <span id="boost" hidden></span>
    </div>
    <div class="camera" aria-label="Caméra">
      <button type="button" id="zoom-in" aria-label="Zoom avant">+</button>
      <button type="button" id="zoom-out" aria-label="Zoom arrière">−</button>
      <button type="button" id="reset-camera" aria-label="Recentrer la caméra">◎</button>
    </div>
    <div class="bottom">
      <div id="notification" class="toast" role="status"></div>
      <div id="guide" class="guide" hidden><span id="guide-text"></span><button type="button" data-action="skip" aria-label="Masquer le tutoriel">×</button></div>
      <section class="business" aria-labelledby="business-title">
        <div class="business-info">
          <div><p id="business-label" class="eyebrow"></p><h2 id="business-title"></h2><p id="business-meta"></p></div>
          <button type="button" id="primary"></button>
        </div>
        <div id="business-actions">
          <button type="button" id="upgrade" data-action="upgrade">Améliorer <strong></strong></button>
          <button type="button" id="hire" data-action="hire">Recruter <strong></strong></button>
        </div>
      </section>
      <nav class="nav" aria-label="Gestion de la ville">
        <button type="button" data-panel="plan"><span aria-hidden="true">▦</span>Plan</button>
        <button type="button" data-panel="missions"><span aria-hidden="true">◇</span>Missions</button>
        <button type="button" data-panel="shop"><span aria-hidden="true">▱</span>Boutique</button>
        <button type="button" data-panel="menu"><span aria-hidden="true">≡</span>Gestion</button>
      </nav>
    </div>
  </main>
  <dialog id="sheet" aria-labelledby="sheet-title">
    <div class="sheet-inner">
      <header class="sheet-header"><h2 id="sheet-title"></h2><button type="button" id="close-sheet" aria-label="Fermer">×</button></header>
      <div id="sheet-content"></div>
    </div>
  </dialog>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
