$('city').onclick=e=>{let b=e.target.closest('[data-i]');if(!b)return;let i=+b.dataset.i;if(i<s.shops.length)s.selected=i;else if(i===s.shops.length){if(s.cash>=prices[i]&&confirm('Construire '+names[i]+' pour '+fmt(prices[i])+' ?')){s.cash-=prices[i];s.shops.push({rank:1,staff:0});setTimeout(()=>{let el=$('city').querySelector('[data-i="'+i+'"]');if(el)el.classList.add('new')},0);s.selected=i;s.xp+=35}else $('msg').textContent='Prochain commerce : '+names[i]+' — '+fmt(prices[i])}draw();save()};$('sell').onclick=()=>{let g=document.createElement('div');g.className='gain';g.textContent='+'+fmt(rev(s.selected));document.body.append(g);setTimeout(()=>g.remove(),850);s.cash+=rev(s.selected);s.sales++;s.totalSales++;s.totalRevenue+=rev(s.selected);s.xp+=5;beep();draw();save()};$('daily').onclick=()=>{let d=new Date().toDateString();if(s.daily!==d){s.daily=d;let now=Date.now();s.streak=now-s.lastClaim<172800000?s.streak+1:1;s.lastClaim=now;s.cash+=250*level()*Math.min(7,s.streak);draw();save()}};let mode='';const lux=[['🏎️ Voiture',15000],['🛥️ Yacht',100000],['🏡 Villa',500000],['✈️ Jet',2000000],['🏝️ Île',10000000]];function beep(){if(!s.sound)return;try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=660;g.gain.value=.025;o.start();o.stop(a.currentTime+.07);o.onended=()=>a.close()}catch(e){}}let musicCtx=null,musicTimer=null;function musicToggle(){if(musicTimer){clearInterval(musicTimer);musicTimer=null}if(!s.music){if(musicCtx)musicCtx.suspend();return}try{musicCtx??=new (window.AudioContext||window.webkitAudioContext)();musicCtx.resume();let i=0;const notes=[261.63,329.63,392,440,392,329.63,293.66,329.63];musicTimer=setInterval(()=>{if(document.hidden)return;let o=musicCtx.createOscillator(),g=musicCtx.createGain(),t=musicCtx.currentTime;o.type='sine';o.frequency.value=notes[i++%notes.length];g.gain.setValueAtTime(.025,t);g.gain.exponentialRampToValueAtTime(.001,t+.38);o.connect(g);g.connect(musicCtx.destination);o.start(t);o.stop(t+.4)},450)}catch(e){}}document.addEventListener('pointerdown',()=>{if(s.music&&!musicTimer)musicToggle()},{passive:true});function tasks(){return [['10 ventes',s.sales,10,150],['3 commerces',s.shops.length,3,1500],['Niveau 10',level(),10,3000],['9 commerces',s.shops.length,9,1000000],['100 ventes',s.sales,100,2000],['10 employés',s.shops.reduce((a,b)=>a+b.staff,0),10,5000],['Niveau 25',level(),25,25000]]}function extra(){let e=$('extra');e.hidden=!mode;if(mode==='missions')e.innerHTML=tasks().map((t,i)=>'<div class="row">'+t[0]+' ('+Math.min(t[1],t[2])+'/'+t[2]+') <button data-claim="'+i+'" '+(s.claimed.includes(i)||t[1]<t[2]?'disabled':'')+'>'+fmt(t[3])+'</button></div>').join('');if(mode==='luxury')e.innerHTML=lux.map((t,i)=>'<div class="row">'+t[0]+' <button data-lux="'+i+'" '+(s.lux.includes(i)||s.cash<t[1]?'disabled':'')+'>'+(s.lux.includes(i)?'Acquis':fmt(t[1]))+'</button></div>').join('')+'<button id="prestige" '+(s.cash<1e7?'disabled':'')+'>Prestige : 10 M € (+50 % permanent)</button>';if(mode==='businesses')e.innerHTML='<h3>Gestion de votre empire</h3><div class="business-list">'+s.shops.map((b,i)=>'<div class="business-card"><h4>'+names[i]+' · Niv. '+b.rank+'</h4><p>Équipe : '+b.staff+' • Vente : '+fmt(rev(i))+'</p><p>Production automatique : '+fmt(b.staff*rev(i)/4*(s.managers.includes(i)?2:1))+'/s</p><button data-manage="'+i+'">Gérer</button> <button data-manager="'+i+'" '+(s.managers.includes(i)||s.cash<base[i]*100?'disabled':'')+'>'+(s.managers.includes(i)?'Directeur recruté':'Directeur '+fmt(base[i]*100))+'</button></div>').join('')+'</div>';if(mode==='statistics')e.innerHTML='<h3>Votre empire</h3><p>Ventes depuis V0.6 : '+s.totalSales+'</p><p>Revenus des ventes depuis V0.6 : '+fmt(s.totalRevenue)+'</p><p>Revenus automatiques / minute : '+fmt(rate()*60)+'</p><p>Employés : '+s.shops.reduce((a,b)=>a+b.staff,0)+'</p>';if(mode==='achievements')e.innerHTML='<h3>Succès</h3>'+[['Entrepreneur',s.sales>=10],['Patron',s.shops.some(b=>b.staff>0)],['Millionnaire',s.cash>=1e6],['Magnat',s.shops.length===9],['Prestige',s.prestige>0]].map(t=>'<p>'+(t[1]?'🏆':'🔒')+' '+t[0]+'</p>').join('');if(mode==='settings')e.innerHTML='<button id="sound">Son : '+(s.sound?'activé':'désactivé')+'</button> <button id="music">Musique : '+(s.music?'activée':'désactivée')+'</button><p>Argent fictif. Sauvegarde sur cet appareil.</p>'}for(let k of ['businesses','missions','luxury','statistics','achievements','settings'])$(k).onclick=()=>{mode=mode===k?'':k;extra();if(mode)$('extra').scrollIntoView({block:'nearest',behavior:'smooth'})};$('extra').onclick=e=>{let b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.manage!==undefined){s.selected=+b.dataset.manage;mode='';$('panel').scrollIntoView({block:'center',behavior:'smooth'})}if(b.dataset.manager!==undefined){let i=+b.dataset.manager;if(!s.managers.includes(i)&&s.cash>=base[i]*100){s.cash-=base[i]*100;s.managers.push(i);s.xp+=25}}if(b.dataset.claim!==undefined){let i=+b.dataset.claim,t=tasks()[i];if(!s.claimed.includes(i)&&t[1]>=t[2]){s.claimed.push(i);s.cash+=t[3]}}if(b.dataset.lux!==undefined){let i=+b.dataset.lux;if(!s.lux.includes(i)&&s.cash>=lux[i][1]){s.cash-=lux[i][1];s.lux.push(i)}}if(b.id==='sound')s.sound=!s.sound;if(b.id==='music'){s.music=!s.music;musicToggle()}if(b.id==='prestige'&&s.cash>=1e7&&confirm('Recommencer avec un bonus permanent ?')){s.cash=100;s.xp=0;s.sales=0;s.shops=[{rank:1,staff:0}];s.selected=0;s.claimed=[];s.managers=[];s.prestige++}draw();extra();save()};const districts=[['Les Jardins',2500,25,3],['La Marina',25000,180,10],['Les Hauts de Mipolune',250000,1500,20]];function districtDraw(){let e=$('districts');if(e.hidden)return;e.innerHTML='<h3>Investissements immobiliers</h3>'+districts.map((d,i)=>'<div class="district-card"><strong>'+d[0]+'</strong><p>Réputation requise : '+d[3]+' • Loyer '+fmt(d[2])+'/s</p><button data-property="'+i+'" '+(s.properties.includes(i)||s.cash<d[1]||le
